apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: ssh-server
  name: ssh-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ssh-server
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: ssh-server
    spec:
      containers:
        - image: us-central1-docker.pkg.dev/project-05da6024-aca6-464e-bd3/markov-repo/ssh-server
          name: ssh-server
          ports:
            - containerPort: 22
              protocol: TCP
          resources:
            limits:
              cpu: "250m"
              memory: "1073741824"
            requests:
              cpu: "250m"
              memory: "1073741824"
          volumeMounts:
            - mountPath: /root/.ssh
              name: ssh-data
      restartPolicy: Always
      volumes:
        - name: ssh-data
          persistentVolumeClaim:
            claimName: ssh-data
