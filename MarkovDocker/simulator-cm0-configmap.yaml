  index.html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <link rel=\"icon\" type=\"image/svg+xml\" href=\"logo.png\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Markov-Eklypse Simulator</title>\n  <style>\n    body {\n      background-color: rgb(33, 33, 33); /* page background */\n      font-family: Calibri, sans-serif; /* use Calibri */\n    }\n\n    /* Centering wrapper for search bar */\n    .input_wrapper {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      width: 50%;\n      max-width: 400px;         \n      margin: 30px auto 20px; \n    }\n\n    /* Collapsing search input */\n    .container {\n      position: relative;\n      --size: 44px; \n      width: var(--size);\n      height: var(--size);\n      color: white;\n    }\n\n    .input {\n      width: 100%;\n      height: 100%;\n      padding-left: 0;\n      padding-right: 0;\n      margin: 0;\n      font-size: 15px;\n      border: none;\n      outline: none;\n      background-color: #191A1E;\n      color: transparent;         /* hides text until expanded */\n      caret-color: transparent;\n      border-radius: 50%;\n      cursor: pointer;\n      transition: all 0.35s ease;\n      box-shadow: \n        1.5px 1.5px 3px #0e0e0e,\n        -1.5px -1.5px 3px rgba(95, 94, 94, 0.25),\n        inset 0 0 0 #0e0e0e,\n        inset 0 0 0 #5f5e5e;\n    }\n\n    /* Expanded / active state */\n    .input:focus,\n    .input:not(:placeholder-shown) {\n      width: 240px;\n      padding-left: var(--size);  /* restore padding when expanded */\n      padding-right: 16px;\n      color: white;\n      caret-color: white;\n      cursor: text;\n      border-radius: 999px;       /* slightly pill shape when expanded */\n      box-shadow: \n        0 0 0 #0e0e0e,\n        0 0 0 rgba(95, 94, 94, 0.25),\n        inset 1.5px 1.5px 3px #0e0e0e,\n        inset -1.5px -1.5px 3px #5f5e5e;\n    }\n\n    /* Placeholder handling */\n    .input::placeholder {\n      opacity: 0;\n      color: transparent;\n    }\n\n    .input:focus::placeholder {\n      opacity: 0.65;\n      color: rgba(255, 255, 255, 0.65);\n    }\n\n    /* Icon always centered in circle */\n    .container .icon {\n      position: absolute;\n      inset: 0;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      pointer-events: none;\n    }\n\n    .container .icon svg {\n      width: 58%;\n      height: 58%;\n    }\n\n    /* Animated button (cleaned up, same behavior) */\n    .animated-button {\n      position: relative;\n      display: flex;\n      align-items: center;\n      gap: 6px;\n      padding: 14px 40px;\n      font-size: 16px;\n      font-weight: 600;\n      color: greenyellow;\n      background: transparent;\n      border: 2px solid greenyellow;\n      border-radius: 999px;\n      box-shadow: 0 0 0 3px greenyellow;\n      cursor: pointer;\n      overflow: hidden;\n      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);\n      margin-top: 20px; /* adds space above the button */\n    }\n\n    .animated-button svg {\n      position: absolute;\n      width: 22px;\n      fill: greenyellow;\n      z-index: 2;\n      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);\n    }\n\n    .animated-button .arr-1 { right: 16px; }\n    .animated-button .arr-2 { left: -40%; }\n\n    .animated-button .text {\n      position: relative;\n      z-index: 1;\n      transform: translateX(-8px);\n      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);\n    }\n\n    .animated-button .circle {\n      position: absolute;\n      top: 50%;\n      left: 50%;\n      transform: translate(-50%, -50%);\n      width: 0;\n      height: 0;\n      background: greenyellow;\n      border-radius: 50%;\n      opacity: 0;\n      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);\n    }\n\n    .animated-button:hover {\n      color: #121212;\n      border-color: transparent;\n      box-shadow: 0 0 0 14px transparent;\n      border-radius: 16px;\n    }\n\n    .animated-button:hover .arr-1 { right: -40%; }\n    .animated-button:hover .arr-2 { left: 16px; }\n    .animated-button:hover .text { transform: translateX(8px); }\n    .animated-button:hover svg { fill: #121212; }\n    .animated-button:hover .circle {\n      width: 260px;\n      height: 260px;\n      opacity: 1;\n    }\n\n    .animated-button:active {\n      scale: 0.96;\n      box-shadow: 0 0 0 6px greenyellow;\n    }\n\n    .search-button {\n      margin-left: 8px; /* space between input and arrow */\n      margin-right: 20px;\n      background-color: transparent;\n      outline: none;\n      border: none;\n      cursor: pointer;\n      padding: 5px;\n      border-radius: 15%;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      width: 35px;\n      height: 35px;\n      transition: background-color 0.3s ease;\n    }\n\n    .search-button:hover {\n      background-color: greenyellow; /* hover box */\n    }\n\n    .search-button svg {\n      width: 100%;\n      height: 100%;\n    }\n\n    .search-button svg line {\n      stroke: greenyellow; /* arrow color */\n      stroke-width: 3;\n      stroke-linecap: round;\n      transition: stroke 0.3s ease;\n    }\n\n    .search-button:hover svg line {\n      stroke: black; /* contrast on hover */\n    }\n\n  </style>\n</head>\n<body>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">RUNNING MARKOV</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">Instructions</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(1) Use codel to ask for two proteins with the corresponding properties of your choices that you plan to run in the docking simulation.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(2) By using codel for software engineering and Machine Learning development you consent to the Affredo License for all outputs of the model.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(3) The Simulator uses glowworm swarm optimization and quantum statistical field theoretic corrections with 96.63% accuracy to achieve optimal results.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(4) Submit two proteins that wish to simulate the docking simulation with in the platform.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(5) If you entered a bad entry try again.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(6) Select the number of cores from 1 to four that you wish to use for the simulation, in the majority of cases you will need 1 core, 1000 glowworms and 10 steps.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(7) Select the number of glowworms you wish to use for the simulation.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(8) Select the number of steps you wish to use for the simulation.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(9) Each docking simulation will take a few hours to complete and you can submit hundreds per thousands of simulations per day if you wish to do so.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(10) Afterwards it is advised that the pdb file be used in experimental equipment to verify the treatment in the laboratory.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(11) Uses in the development in pathogens or weapons of mass destruction are stricly forbidden and will result in a permanent ban.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">(12) By using our software you consent that you will abide by these rules and that they will be enforced on the individuals that use this platform.</div>\n  <div style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\">Best! Integral Sequencing Team</div>\n  \n  <form id=\"searchForm\" style=\"margin-top: 20px; display: inline-block;\">\n    <div class=\"container\">\n      <input type=\"text\" name=\"text\" class=\"input\" required placeholder=\"Type to search...\">\n        <div class=\"icon\">\n          <svg xmlns=\"http://www.w3.org/2000/svg\" class=\"ionicon\" viewBox=\"0 0 512 512\">\n            <title>Search</title>\n              <path d=\"M221.09 64a157.09 157.09 0 10157.09 157.09A157.1 157.1 0 00221.09 64z\" fill=\"none\" stroke=\"currentColor\" stroke-miterlimit=\"10\" stroke-width=\"32\"></path>\n              <path fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-miterlimit=\"10\" stroke-width=\"32\" d=\"M338.29 338.29L448 448\"></path>\n            </svg>\n        </div>\n      </div>\n    <button class=\"search-button\" style=\"margin-top: 8px;\">\n      <svg viewBox=\"0 0 50 50\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n        <line x1=\"5\" y1=\"25\" x2=\"40\" y2=\"25\"/>\n        <line x1=\"30\" y1=\"15\" x2=\"40\" y2=\"25\"/>\n        <line x1=\"30\" y1=\"35\" x2=\"40\" y2=\"25\"/>\n      </svg>\n    </button>\n  </form>\n\n  <form id=\"runLightdock\">\n    <button class=\"animated-button\">\n      <svg viewBox=\"0 0 24 24\" class=\"arr-2\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path\n          d=\"M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z\"\n        ></path>\n      </svg>\n      <span class=\"text\">Run Simulation</span>\n      <span class=\"circle\"></span>\n      <svg viewBox=\"0 0 24 24\" class=\"arr-1\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path\n          d=\"M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z\"\n        ></path>\n      </svg>\n    </button>\n  </form>\n  <div id=\"fileContent\" style=\"font-size: 12.6px; margin-top: 19px; color: rgb(185, 185, 185); max-width: 85%;\"></div>\n  <div id=\"status\" style=\"color: lightgreen; margin-top: 10px;\"></div>\n  <script>\n    async function fetchFileContent() {\n      try {\n        const response = await fetch('/server_one/html', {\n          method: 'GET',\n          credentials: 'include'\n        });\n        if (response.ok) {\n          const text = await response.text();\n      \n          // Split the content at the first occurrence of \"...\"\n          const splitContent = text.split('...')[0] + '...';\n          \n          let message = splitContent.split('\\n')[0]; \n          document.getElementById('fileContent').innerText = message;\n\t  \n          // split the file content into lines\n          const lines = text.split(/\\r?\\n/);\n\n          // Ensure there's at least two lines to check for a blank line\n          if (lines.length < 2) {\n            console.log(\"No second line or content to process.\");\n          } else if (/^\\s*$/.test(lines[1])) {\n            // join and log the content to the console after the blank line\n            console.log(lines.slice(2).join(\"\\n\"));\n            // display the table\n            displayTable(lines.slice(2).join(\"\\n\"))\n          } else if (!/^\\s*$/.test(lines[1])) {\n           console.log(\"No blank line after the first line.\");\n          } else {\n            console.error(\"Error fetching tabular data: \", response.status)\n          }\n          \n          // Send the fetched content to the backend\n          await sendFileContentToBackend();\n        } else {\n          console.error(\"Error fetching the file:\", response.status);\n        }\n      } catch (error) {\n        console.error(\"Error fetching the file:\", error);\n      }    \n    }\n\n    async function sendFileContentToBackend() {\n      try {\n        const fileContent = document.getElementById('fileContent').innerText;\n\n        const response = await fetch('/receive_signal/html', {\n          method: 'POST',\n              headers: {\n                  'Content-Type': 'application/json',\n              },\n              body: JSON.stringify({ content: fileContent }),\n          });\n\n        if (response.ok) {\n              console.log('File content sent to backend successfully');\n              const result = await response.json();\n              document.getElementById('status').innerText = result.message;\n          } else {\n              console.error('Error sending file content to backend:', response.status);\n          }\n      } catch (error) {\n          console.error('Error:', error);\n      }\n    }\n\n    function displayTable(rawData) {\n      try {\n        // Get the div where content is to be displayed\n        const fileContentDiv = document.getElementById('fileContent');\n\n        // Parse raw data into an array of objects\n        const lines = rawData.trim().split('\\n'); // Split raw data into lines\n        const headers = lines[0].trim().split(/\\s+/); // Extract headers (first line)\n        const data = lines.slice(1).map((line) => {\n            const values = line.trim().split(/\\s+/); // Split line into values\n            const row = {};\n            headers.forEach((header, index) => {\n                row[header] = values[index] || ''; // Map headers to values\n            });\n            return row;\n        });\n\n        // Validate if data is parsed correctly\n        if (data.length === 0) {\n          const fileContentDiv = document.getElementById('fileContent');\n        }\n\n        // Create a table element\n        const table = document.createElement('table');\n        table.style.borderCollapse = 'collapse';\n        table.style.width = '100%';\n        table.style.color = 'white';\n        table.style.backgroundColor = '#3e3e3e';\n\n        // Add table headers\n        const thead = document.createElement('thead');\n        const headerRow = document.createElement('tr');\n        headers.forEach((key) => {\n            const th = document.createElement('th');\n            th.textContent = key;\n            th.style.border = '1px solid #ddd';\n            th.style.padding = '8px';\n            th.style.textAlign = 'left';\n            th.style.backgroundColor = '#555';\n            th.style.color = 'white';\n            headerRow.appendChild(th);\n        });\n        thead.appendChild(headerRow);\n        table.appendChild(thead);\n\n        // Add table rows\n        const tbody = document.createElement('tbody');\n        data.forEach((row) => {\n            const tr = document.createElement('tr');\n            headers.forEach((key) => {\n                const td = document.createElement('td');\n                td.textContent = row[key];\n                td.style.border = '1px solid #ddd';\n                td.style.padding = '8px';\n                td.style.textAlign = 'left';\n                td.style.color = 'white';\n                td.style.backgroundColor = '#464646';\n                tr.appendChild(td);\n            });\n            tbody.appendChild(tr);\n        });\n        table.appendChild(tbody);\n\n        // Append the table to the fileContentDiv\n        fileContentDiv.appendChild(table);\n        } catch (error) {\n            // Display error message\n            const fileContentDiv = document.getElementById('fileContent');\n            fileContentDiv.innerHTML = `<p style=\"color: red;\">Error: ${error.message}</p>`;\n        }\n      }\n\n    // Check for file updates and fetch content every 5 seconds\n    fetchFileContent();\n\n    setInterval(() => {\n      if (document.visibilityState === 'visible') {\n        fetchFileContent();\n      }\n    }, 5000);\n  </script>\n  <script src=\"client.js?v=12345\" defer></script>\n  <script src=\"simulate/client.js\" defer></script>\n</body>\n</html>"
  json_to_names.py: "import json\nimport os\n\n# Load the JSON data from the file\nwith open('data.json', 'r') as file:\n    data = json.load(file)\n\n# Access the element in the query key and enclose it with quotation marks\nelement = data[\"query\"] + \n\n# Open the file in append mode and write the element\nwith open(\"names.txt\", \"a\") as f:\n    f.write(element)\n"
