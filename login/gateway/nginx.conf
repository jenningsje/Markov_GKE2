server {
    listen 80;
    server_name _;

    port_in_redirect off;
    absolute_redirect off;

    resolver 127.0.0.11 valid=10s;

    location = / {
        return 302 /login/;
    }

    # login frontend
    location /login/ {
        proxy_pass http://login:1112/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # apps dashboard
    location /apps/ {
        auth_request /auth_check;

        proxy_pass http://apps:1113/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    # login backend
    location /backend/ {
        proxy_pass http://backend:1114/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    # simulator frontend
    location /simulator/ {
        auth_request /auth_check;

        proxy_pass http://simulator:4001/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    # auth check
    location = /auth_check {
        internal;

        proxy_pass http://backend:1114/auth/verify;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Cookie $http_cookie;
    }

    # download frontend
    location /output/ {
        proxy_pass http://downloadapp:3001/output/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /download/ {
        proxy_pass http://downloadapp:3001/download/;
    }

    location = /download {
        return 301 /download/;
    }

    location /chat/ {
        proxy_pass http://codel:8887/;
        proxy_set_header Cookie $http_cookie;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;

        proxy_redirect off;
    }

    location /assets/ {
        proxy_pass http://codel:8887/assets/;
    }

    location /src/ {
        proxy_pass http://codel:8887/src/;
    }

    location /favicon.ico {
        proxy_pass http://codel:8887/favicon.ico;
    }

    location /site.webmanifest {
        proxy_pass http://codel:8887/site.webmanifest;
    }

    location /ollama/ {
        proxy_pass http://34.172.30.27:11434;
    }

    location /graphql {
        proxy_pass http://codel:8887/graphql;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /Inter-roman.var.woff2 {
        proxy_pass http://codel:8887/Inter-roman.var.woff2;
        access_log off;
    }

    location /fe/assets/ {
        proxy_pass http://codel:8887/fe/assets/;
    }

    location /viewer/ {
        auth_request /auth_check;

        proxy_pass http://viewer:8083/;

        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Flask receive_signal
    location /receive_signal/ {
        auth_request /auth_check;

        proxy_pass http://flaskapp:80/;

        proxy_ssl_verify off;
        proxy_set_header Cookie $http_cookie;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    # Node.js server_one
    location /server_one/ {
        auth_request /auth_check;

        proxy_pass http://nodeapp:5001/;

        proxy_ssl_verify off;
        proxy_set_header Cookie $http_cookie;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }
}
