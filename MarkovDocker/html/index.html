<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markov-Eklypse Simulator</title>
    <style>
        :root {
            --size: 1;
        }
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
        }
        body {
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            margin: 0 0 20px 0;
        }
        h2 {
            margin-top: 30px;
        }
        textarea,
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        button {
            padding: 10px 18px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #888;
            border-radius: 4px;
            background: #eee;
        }
        button:hover {
            background: #ddd;
        }
        .section {
            margin-bottom: 30px;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            min-height: 20px;
        }
        #fileContent {
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 15px;
            min-height: 100px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #f2f2f2;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Markov-Eklypse Simulator</h1>
    <!-- MESSAGE -->
    <div class="section">
        <h2>Message</h2>
        <div id="fileContent"></div>
        <div id="status" class="status"></div>
    </div>
    <!-- PROTEIN SEARCH -->
    <div class="section">
        <h2>Protein Search</h2>
        <input
            id="searchInput"
            type="text"
            placeholder="Enter protein names"
        >
        <button id="searchButton">
            Search
        </button>
        <div id="searchStatus" class="status"></div>
    </div>
    <!-- RESULTS -->
    <div class="section">
        <h2>Results</h2>
        <div id="resultsTable"></div>
    </div>
    <!-- SIMULATION -->
    <div class="section">
        <h2>Simulation</h2>
        <button id="simulateButton">
            Run Simulation
        </button>
        <div id="simulateStatus" class="status"></div>
    </div>
</div>
<script>
/*
 * ============================================================
 * ROUTES
 * ============================================================
 */
const SERVER_ONE_HTML = '/server_one/html';
const SERVER_ONE_SIMULATE = '/server_one/html/simulate';
const FLASK_HTML = '/receive_signal/html';
let CURRENT_USER_ID = null;
/*
 * ============================================================
 * AUTHENTICATION
 * ============================================================
 *
 * We do NOT send the user ID manually from JavaScript.
 *
 * credentials: 'include' sends the authentication cookie.
 * Flask reads the JWT from that cookie and gets:
 *
 *     request.user["id"]
 *
 * ============================================================
 */
async function initializeUser() {
    try {
        const response = await fetch('/auth_check', {
            method: 'GET',
            credentials: 'include'
        });
        if (!response.ok) {
            console.error('Authentication check failed');
            return false;
        }
        const result = await response.json();
        if (result.user_id !== undefined && result.user_id !== null) {
            CURRENT_USER_ID = String(result.user_id);
            console.log(
                'Authenticated user:',
                CURRENT_USER_ID
            );
        }
        return true;
    } catch (error) {
        console.error(
            'Error checking authentication:',
            error
        );
        return false;
    }
}
/*
 * ============================================================
 * SEND MESSAGE TO FLASK
 * ============================================================
 *
 * IMPORTANT:
 *
 * The MESSAGE goes to Flask.
 *
 * Protein names do NOT go to Flask.
 *
 * The JWT cookie is automatically included because of:
 *
 *     credentials: 'include'
 *
 * Flask obtains the user ID from the JWT.
 *
 * Flask then writes:
 *
 *     /mount/user-<id>/output/from_front_end.txt
 *
 * ============================================================
 */
async function sendFileContentToBackend(message) {
    try {
        if (
            message === null ||
            message === undefined ||
            message.trim() === ''
        ) {
            console.warn(
                'No message to send to Flask'
            );
            return false;
        }
        console.log(
            'Sending MESSAGE to Flask for authenticated user'
        );
        const response = await fetch(
            FLASK_HTML,
            {
                method: 'POST',
                /*
                 * THIS IS CRITICAL.
                 *
                 * It sends the JWT authentication cookie.
                 */
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                },
                /*
                 * Only the MESSAGE is sent here.
                 *
                 * No protein names.
                 * No manually supplied user ID.
                 */
                body: JSON.stringify({
                    content: message
                })
            }
        );
        let result = {};
        try {
            result = await response.json();
        } catch (jsonError) {
            console.error(
                'Flask did not return JSON:',
                jsonError
            );
        }
        if (!response.ok) {
            console.error(
                'Flask rejected the message:',
                result
            );
            document.getElementById(
                'status'
            ).innerText =
                'Error sending message to Flask.';
            return false;
        }
        console.log(
            'Message successfully sent to Flask.'
        );
        if (result.user_id !== undefined) {
            console.log(
                'Flask processed user ID:',
                result.user_id
            );
        }
        document.getElementById(
            'status'
        ).innerText =
            result.message ||
            'Message sent successfully.';
        return true;
    } catch (error) {
        console.error(
            'Error sending message to Flask:',
            error
        );
        document.getElementById(
            'status'
        ).innerText =
            'Error sending message to Flask.';
        return false;
    }
}
/*
 * ============================================================
 * DISPLAY RESULTS TABLE
 * ============================================================
 */
function displayTable(data) {
    const resultsTable =
        document.getElementById('resultsTable');
    if (!resultsTable) {
        return;
    }
    resultsTable.innerHTML = '';
    if (!Array.isArray(data) || data.length === 0) {
        resultsTable.innerText =
            'No results available.';
        return;
    }
    const table =
        document.createElement('table');
    const headerRow =
        document.createElement('tr');
    const keys =
        Object.keys(data[0]);
    keys.forEach(function(key) {
        const th =
            document.createElement('th');
        th.innerText = key;
        headerRow.appendChild(th);
    });
    table.appendChild(headerRow);
    data.forEach(function(row) {
        const tr =
            document.createElement('tr');
        keys.forEach(function(key) {
            const td =
                document.createElement('td');
            const value =
                row[key];
            if (
                value !== null &&
                typeof value === 'object'
            ) {
                td.innerText =
                    JSON.stringify(value);
            } else {
                td.innerText =
                    value ?? '';
            }
            tr.appendChild(td);
        });
        table.appendChild(tr);
    });
    resultsTable.appendChild(table);
}
/*
 * ============================================================
 * GET CONTENT FROM NODE
 * ============================================================
 *
 * Node returns the message and protein/result information.
 *
 * We deliberately separate the MESSAGE from the table so that
 * the table can NEVER accidentally get written into
 * from_front_end.txt.
 * ============================================================
 */
async function fetchFileContent() {
    try {
        const response =
            await fetch(
                SERVER_ONE_HTML,
                {
                    method: 'GET',
                    credentials: 'include'
                }
            );
        if (!response.ok) {
            console.error(
                'Node returned HTTP status:',
                response.status
            );
            return;
        }
        const text =
            await response.text();
        /*
         * The FIRST LINE is the message.
         *
         * This is what gets sent to Flask.
         */
        const lines =
            text.split(/\r?\n/);
        const message =
            lines.length > 0
                ? lines[0].trim()
                : '';
        /*
         * Display the MESSAGE separately.
         */
        document.getElementById(
            'fileContent'
        ).innerText = message;
        /*
         * Send ONLY the MESSAGE to Flask.
         */
        if (message !== '') {
            await sendFileContentToBackend(
                message
            );
        }
        /*
         * ====================================================
         * PARSE RESULT DATA
         * ====================================================
         *
         * Everything after the message is treated as result
         * information and displayed separately.
         */
        const dataLines =
            lines.slice(1)
                .filter(function(line) {
                    return line.trim() !== '';
                });
        if (dataLines.length === 0) {
            displayTable([]);
            return;
        }
        let parsedData = [];
        try {
            /*
             * Try parsing the remaining content as JSON.
             */
            const remainingText =
                dataLines.join('\n');
            const parsed =
                JSON.parse(remainingText);
            if (Array.isArray(parsed)) {
                parsedData = parsed;
            } else if (
                parsed &&
                typeof parsed === 'object'
            ) {
                parsedData = [parsed];
            }
        } catch (jsonError) {
            /*
             * If the remaining content isn't JSON,
             * leave the table empty rather than mixing it
             * with the MESSAGE.
             */
            console.log(
                'Node result content is not JSON.'
            );
        }
        displayTable(parsedData);
    } catch (error) {
        console.error(
            'Error fetching content from Node:',
            error
        );
    }
}
/*
 * ============================================================
 * PROTEIN SEARCH
 * ============================================================
 *
 * Protein names go ONLY to Node.
 *
 * They are NOT sent to Flask.
 * ============================================================
 */
async function searchProteins() {
    const searchInput =
        document.getElementById(
            'searchInput'
        );
    const searchStatus =
        document.getElementById(
            'searchStatus'
        );
    const searchQuery =
        searchInput.value.trim();
    if (searchQuery === '') {
        searchStatus.innerText =
            'Enter protein names first.';
        return;
    }
    searchStatus.innerText =
        'Sending protein names to Node...';
    try {
        const response =
            await fetch(
                SERVER_ONE_HTML,
                {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type':
                            'application/json; charset=UTF-8'
                    },
                    /*
                     * PROTEIN NAMES GO TO NODE.
                     *
                     * This does NOT go to Flask.
                     */
                    body: JSON.stringify({
                        query: searchQuery
                    })
                }
            );
        const result =
            await response.json();
        if (!response.ok) {
            console.error(
                'Node rejected protein search:',
                result
            );
            searchStatus.innerText =
                result.error ||
                'Protein search failed.';
            return;
        }
        searchStatus.innerText =
            result.message ||
            'Protein names sent successfully.';
        /*
         * Refresh Node content.
         *
         * If Node has generated a MESSAGE,
         * fetchFileContent() will send that MESSAGE
         * to Flask.
         */
        await fetchFileContent();
    } catch (error) {
        console.error(
            'Protein search error:',
            error
        );
        searchStatus.innerText =
            'Error sending protein names to Node.';
    }
}
/*
 * ============================================================
 * SIMULATION
 * ============================================================
 *
 * Simulation request goes to Node first.
 *
 * The user identity is carried by the JWT cookie.
 * ============================================================
 */
async function runSimulation() {
    const simulateStatus =
        document.getElementById(
            'simulateStatus'
        );
    const searchInput =
        document.getElementById(
            'searchInput'
        );
    const searchQuery =
        searchInput.value.trim();
    simulateStatus.innerText =
        'Starting simulation...';
    try {
        const response =
            await fetch(
                SERVER_ONE_SIMULATE,
                {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type':
                            'application/json; charset=UTF-8'
                    },
                    body: JSON.stringify({
                        query: searchQuery
                    })
                }
            );
        const result =
            await response.json();
        if (!response.ok) {
            console.error(
                'Node simulation request failed:',
                result
            );
            simulateStatus.innerText =
                result.error ||
                'Simulation request failed.';
            return;
        }
        simulateStatus.innerText =
            result.message ||
            'Simulation started successfully.';
        /*
         * Refresh content after starting the simulation.
         */
        await fetchFileContent();
    } catch (error) {
        console.error(
            'Simulation error:',
            error
        );
        simulateStatus.innerText =
            'Error starting simulation.';
    }
}
/*
 * ============================================================
 * EVENT HANDLERS
 * ============================================================
 */
document.addEventListener(
    'DOMContentLoaded',
    async function() {
        /*
         * Verify authentication first.
         */
        await initializeUser();
        /*
         * Load existing Node content.
         *
         * If there is a MESSAGE, it will be sent to Flask.
         */
        await fetchFileContent();
        /*
         * Protein search button.
         */
        const searchButton =
            document.getElementById(
                'searchButton'
            );
        if (searchButton) {

            searchButton.addEventListener(
                'click',
                searchProteins
            );
        }
        /*
         * Allow Enter in the search box.
         */
        const searchInput =
            document.getElementById(
                'searchInput'
            );
        if (searchInput) {
            searchInput.addEventListener(
                'keydown',
                function(event) {

                    if (
                        event.key === 'Enter'
                    ) {

                        event.preventDefault();

                        searchProteins();
                    }
                }
            );
        }
        /*
         * Simulation button.
         */
        const simulateButton =
            document.getElementById(
                'simulateButton'
            );
        if (simulateButton) {

            simulateButton.addEventListener(
                'click',
                runSimulation
            );
        }
        /*
         * Periodically check Node for updated
         * MESSAGE/results.
         *
         * The exact MESSAGE is then sent to Flask.
         */
        setInterval(
            fetchFileContent,
            5000
        );
    }
);
</script>
</body>
</html>
