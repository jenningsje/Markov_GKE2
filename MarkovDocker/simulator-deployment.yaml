apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
spec:
  replicas: 1

  selector:
    matchLabels:
      app: simulator

  template:
    metadata:
      labels:
        app: simulator

    spec:
      containers:
        - name: simulator
          image: us-central1-docker.pkg.dev/project-05da6024-aca6-464e-bd3/markov-repo/simulatorapp:v12
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80

            - name: api
              containerPort: 4001
