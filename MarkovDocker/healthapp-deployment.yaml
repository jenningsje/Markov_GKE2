apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: healthapp
  name: healthapp
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: healthapp
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: healthapp
    spec:
      containers:
        - args:
            - /bin/sh
            - /opt/app/lightdock/server_health.sh
          image: us-central1-docker.pkg.dev/project-05da6024-aca6-464e-bd3/markov-repo/health_app
          name: healthapp
          ports:
            - containerPort: 3003
              protocol: TCP
          resources:
            limits:
              cpu: "250m"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "1Gi"
          stdin: true
          tty: true
          volumeMounts:
            - mountPath: /etc/nginx/certs
              name: healthapp-cm0
            - mountPath: /etc/nftables.nft
              name: healthapp-cm1
              subPath: nftables.nft
      restartPolicy: Always
      volumes:
        - configMap:
            name: healthapp-cm0
          name: healthapp-cm0
        - configMap:
            items:
              - key: nftables.nft
                path: nftables.nft
            name: healthapp-cm1
          name: healthapp-cm1
